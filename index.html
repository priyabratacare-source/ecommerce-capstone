```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopEase - Modern online shopping experience"
    >

    <title>ShopEase - Online Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="site-header">

        <div class="container navbar">


            <!-- LOGO -->

            <a
                href="#/"
                class="logo"
            >
                Shop<span>Ease</span>
            </a>


            <!-- NAVIGATION -->

            <nav class="nav-links">

                <a href="#/">
                    Home
                </a>

                <a href="#/products">
                    Products
                </a>

                <a href="#/cart">
                    Cart
                    <span
                        id="cartCount"
                        class="cart-count"
                    >
                        0
                    </span>
                </a>

                <!-- ADMIN LOGIN -->

                <a
                    href="#/admin/login"
                    class="admin-nav-button"
                >
                    🔐 Admin Login
                </a>

            </nav>


            <!-- SEARCH -->

            <form
                class="search-box"
                onsubmit="return false;"
            >

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    aria-label="Search"
                >
                    Search
                </button>

            </form>


        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main
        id="app"
        class="main-content"
    >

        <section class="loading-state">

            <div class="loader"></div>

            <p>
                Loading ShopEase...
            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="site-footer">

        <div class="container footer-content">


            <div>

                <a
                    href="#/"
                    class="logo"
                >
                    Shop<span>Ease</span>
                </a>

                <p>
                    Your simple and modern
                    online shopping experience.
                </p>

            </div>


            <div class="footer-links">

                <a href="#/">
                    Home
                </a>

                <a href="#/products">
                    Products
                </a>

                <a href="#/cart">
                    Cart
                </a>

                <a href="#/admin/login">
                    Admin
                </a>

            </div>


        </div>


        <div class="footer-bottom">

            © 2026 ShopEase.
            All rights reserved.

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="js/app.js"
    ></script>


</body>

</html>
```
