<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ShopEase - Modern E-Commerce Store"
    >

    <title>ShopEase | E-Commerce Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="site-header">

        <div class="container navbar">

            <a
                href="#/"
                class="logo"
            >
                Shop<span>Ease</span>
            </a>


            <nav class="nav-links">

                <a href="#/">
                    Home
                </a>

                <a href="#/products">
                    Products
                </a>

                <a href="#/cart">
                    Cart
                    <span
                        id="cartCount"
                        class="cart-count"
                    >
                        0
                    </span>
                </a>

            </nav>


            <div class="search-box">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products..."
                    aria-label="Search products"
                >

                <button
                    id="searchButton"
                    type="button"
                >
                    Search
                </button>

            </div>

        </div>

    </header>


    <main
        id="app"
        class="container main-content"
    >

        <div class="loading-state">

            <div class="loader"></div>

            <p>
                Loading ShopEase...
            </p>

        </div>

    </main>


    <footer class="site-footer">

        <div class="container footer-content">

            <div>

                <a
                    href="#/"
                    class="logo"
                >
                    Shop<span>Ease</span>
                </a>

                <p>
                    Your modern online shopping destination.
                </p>

            </div>


            <div class="footer-links">

                <a href="#/">
                    Home
                </a>

                <a href="#/products">
                    Products
                </a>

                <a href="#/cart">
                    Cart
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                © 2026 ShopEase. All rights reserved.
            </p>

        </div>

    </footer>


    <script
        type="module"
        src="js/app.js"
    ></script>

</body>

</html>
